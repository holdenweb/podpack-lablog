[project]
name = "podpack-lablog"
version = "0.2.0"
description = "A testing history for each project, as a podpack app: expectation, observations, conclusion"
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
authors = [
    { name = "Steve Holden", email = "steve@holdenweb.com" }
]
requires-python = ">=3.12"
keywords = ["flask", "plugins", "web", "testing", "lab notebook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Testing",
]
# Everything this package imports, podpack excepted (see the dev group below).
# flask-wtf and flask itself arrive through podpack's flask-security anyway;
# declared because a dependency held only by somebody else's dependency is one
# refactor upstream from vanishing. markdown-it-py is this app's own choice --
# render.py says why it is not the `markdown` library podpack-pages uses.
dependencies = [
    "flask>=3.0",
    "flask-wtf>=1.3.0",
    "markdown-it-py>=4.3.0",
    "sqlalchemy>=2.0",
    "wtforms>=3.3.2",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# podpack is here and not in `dependencies`: a real dependency's
# [tool.uv.sources] entry travels with the distribution, so a site naming
# podpack from any other source could not lock alongside this app
# (writing-an-app.md section 2). A dependency group is development-only and
# constrains nobody downstream. The cost is that no minimum podpack version can
# be stated here; the README states it instead.
dev = [
    "mypy>=2.4.1",
    "podpack",
    "pytest>=9.2.0",
    "types-wtforms>=3.3.0.20261104",
]

[tool.uv.sources]
# From the repository rather than a sibling checkout, so `uv sync` works on any
# machine and in CI. `uv add --dev --editable ../podpack` switches to a local
# checkout when the framework and this app are changing together.
podpack = { git = "https://github.com/holdenweb/podpack.git" }

[tool.mypy]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# flask-wtf ships neither inline types nor a stubs package, so it alone is let
# off; a blanket ignore_missing_imports would silence every future untyped
# import along with it. WTForms has types-WTForms, in the dev group.
[[tool.mypy.overrides]]
module = ["flask_wtf", "flask_wtf.*"]
ignore_missing_imports = true
